spring.application.name=TicketFlow
server.port=8080
spring.threads.virtual.enabled=true

# Modo de sincronizacao: SEM_TRAVA, TRAVA_GLOBAL ou TRAVA_POR_ASSENTO
# Pode ser sobrescrito na linha de comando ou via variavel de ambiente
# TICKETFLOW_MODO_SINCRONIZACAO (binding automatico do Spring).
ticketflow.modo-sincronizacao=TRAVA_POR_ASSENTO
ticketflow.quantidade-assentos=50
ticketflow.quantidade-trabalhadores=4
ticketflow.ttl-reserva-segundos=30
ticketflow.intervalo-expiracao-ms=1000
